<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>GOLD &amp; ASH icon</title>
<!-- 512x512 Roblox experience icon. ?lang=ko (금빛과 재) or ?lang=en (GOLD & ASH).
     Rendered by render_art.py; fonts are injected by that script (FontFace API). -->
<style>
  html, body { margin: 0; padding: 0; background: #0B0A0E; }
  svg { display: block; }
  text { font-family: 'Black Han Sans', 'Do Hyeon', sans-serif; }
  .en { font-family: 'Anton', 'Black Han Sans', sans-serif; }
</style>
<script src="common.js"></script>
</head>
<body>
<svg id="art" xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"></svg>
<script>
const LANG = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'ko';

function draw() {
  const W = 512, H = 512, C = GA.C;
  const R = GA.rng(2024);
  // split line (gold upper-left / ash lower-right) through the impact point
  const A = [432, -12], B = [150, 524];
  const P = { x: 292, y: 248 };            // impact point
  const goldPoly = GA.poly([[-10, -10], [A[0], A[1]], [B[0], B[1]], [-10, 524]]);
  const ashPoly = GA.poly([[A[0], A[1]], [524, -10], [524, 524], [B[0], B[1]]]);

  let s = `<defs>
    <clipPath id="clipGold"><path d="${goldPoly}"/></clipPath>
    <clipPath id="clipAsh"><path d="${ashPoly}"/></clipPath>
    <radialGradient id="bgGold" gradientUnits="userSpaceOnUse" cx="${P.x}" cy="${P.y}" r="420">
      <stop offset="0" stop-color="#FFF1BE"/><stop offset=".14" stop-color="#FFC44A"/>
      <stop offset=".38" stop-color="#E0741A"/><stop offset=".66" stop-color="#8E2E08"/><stop offset="1" stop-color="#2E0B03"/></radialGradient>
    <radialGradient id="bgAsh" gradientUnits="userSpaceOnUse" cx="${P.x}" cy="${P.y}" r="400">
      <stop offset="0" stop-color="#7A1820"/><stop offset=".25" stop-color="#3A1216"/>
      <stop offset=".6" stop-color="#1B1519"/><stop offset="1" stop-color="#0A090C"/></radialGradient>
    <radialGradient id="flash" gradientUnits="userSpaceOnUse" cx="${P.x}" cy="${P.y}" r="78">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".22" stop-color="#FFFBE6"/>
      <stop offset=".5" stop-color="#FFD76A" stop-opacity=".7"/><stop offset="1" stop-color="#FF9A2A" stop-opacity="0"/></radialGradient>
    <radialGradient id="flashRed" gradientUnits="userSpaceOnUse" cx="${P.x}" cy="${P.y}" r="150">
      <stop offset="0" stop-color="#FF6A5A" stop-opacity=".9"/><stop offset=".5" stop-color="#D62C34" stop-opacity=".45"/><stop offset="1" stop-color="#D62C34" stop-opacity="0"/></radialGradient>
    <linearGradient id="slashFill" gradientUnits="userSpaceOnUse" x1="${B[0]}" y1="${B[1]}" x2="${A[0]}" y2="${A[1]}">
      <stop offset="0" stop-color="#FF4A48"/><stop offset=".5" stop-color="#D62C34"/><stop offset="1" stop-color="#FF6A5A"/></linearGradient>
    <linearGradient id="txtGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".3" stop-color="#FFF0B0"/><stop offset=".62" stop-color="#FFC44A"/><stop offset="1" stop-color="#E07A12"/></linearGradient>
    <linearGradient id="txtAsh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#D9D4DC"/><stop offset="1" stop-color="#7E7884"/></linearGradient>
    <filter id="bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b"/>
      <feColorMatrix in="b" type="matrix" values="1.1 0 0 0 .12  0 1 0 0 .06  0 0 .6 0 0  0 0 0 1.3 0" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowOnly" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="b"/>
      <feFlood flood-color="#FFD24A"/><feComposite in2="b" operator="in"/></filter>
    <filter id="sticker" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="3.2" result="d"/>
      <feFlood flood-color="#2A0E02"/><feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="blur14" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="smoke" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".011 .02" numOctaves="4" seed="9" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .55  0 0 0 0 .52  0 0 0 0 .56  0 0 0 2.4 -1.05"/></filter>
    <filter id="textShadow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
    <radialGradient id="vig" cx=".5" cy=".5" r=".72">
      <stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
  </defs>`;

  /* ---------- 1. backgrounds ---------- */
  s += `<g clip-path="url(#clipGold)"><rect width="${W}" height="${H}" fill="url(#bgGold)"/>
    <path d="${GA.rays(P.x, P.y, 46, 110, 560, 7, GA.rng(3), { inward: true, even: true })}" fill="#FFF3C0" opacity=".35"/></g>`;
  s += `<g clip-path="url(#clipAsh)"><rect width="${W}" height="${H}" fill="url(#bgAsh)"/>
    <rect width="${W}" height="${H}" filter="url(#smoke)" opacity=".55"/>
    <path d="${GA.rays(P.x, P.y, 40, 120, 560, 6, GA.rng(4), { inward: true, even: true })}" fill="#000" opacity=".4"/></g>`;

  /* ---------- 2. dragon (body + head) ---------- */
  const HP = [330, 150, P.x - 40, P.y - 20, 0.76, 18];   // head placement (local pt -> global)
  const headT = GA.place(...HP);
  const N = GA.map(...HP, 64, 112);                       // neck
  const body = GA.dragonBody('i', [[N[0] + 16, N[1] + 12], [N[0] - 30, N[1] - 34], [N[0] - 44, N[1] - 110], [N[0] + 6, N[1] - 176], [N[0] + 90, N[1] - 210], [N[0] + 190, N[1] - 236]], 80, 44,
    { finSide: -1, seed: 3, bandStep: 18, grad: 'x1="0" y1="-60" x2="0" y2="160"',
      stops: '<stop offset="0" stop-color="#FFD76A"/><stop offset=".6" stop-color="#F0A030"/><stop offset="1" stop-color="#C0620E"/>' });
  // light beam from the jaws into the impact
  const M = GA.map(...HP, 300, 150);
  const dragon = `${body}<g transform="${headT}">${GA.dragonHead('i')}</g>`;
  s += `<g filter="url(#glowOnly)" opacity=".9">${dragon.replace(/id="d[hb]/g, 'id="x$&').replace(/id="xid="/g, 'id="x')}</g>`;
  s += `<g filter="url(#sticker)">${dragon}</g>`;
  s += `<path d="${GA.sliver(M[0], M[1], P.x + 10, P.y + 2, 40, { peak: 0.2, pa: 0.4, pb: 1.2 })}" fill="#FFF6D6" filter="url(#blur6)"/>`;

  /* ---------- 3. katana (right side, tip into the impact) ---------- */
  const kA = [P.x + 20, P.y + 10], kB = [548, 330];
  const kopt = (extra) => Object.assign({ peak: 0.02, pa: 1, pb: 0.22, bow: -8 }, extra);
  s += `<g>
    <path d="${GA.sliver(kB[0], kB[1], kA[0], kA[1], 30, kopt({}))}" fill="#D62C34" filter="url(#blur6)" opacity=".8"/>
    <path d="${GA.sliver(kB[0], kB[1], kA[0], kA[1], 20, kopt({}))}" fill="#0A090C"/>
    <path d="${GA.sliver(kB[0], kB[1], kA[0], kA[1], 16, kopt({ skew: 0.55 }))}" fill="#C9C4CC"/>
    <path d="${GA.sliver(kB[0], kB[1], kA[0], kA[1], 7, kopt({ skew: 1 }))}" fill="#FFFFFF"/>
    <path d="${GA.sliver(kB[0], kB[1], kA[0], kA[1], 5, kopt({ skew: 0 }))}" fill="#FF4A48"/></g>`;

  /* ---------- 4. ash particles streaming toward the impact ---------- */
  let flakes = '', embers = '';
  const ar = GA.rng(77);
  for (let i = 0; i < 150; i++) {
    const t = ar(), x = GA.C && (P.x + 20 + Math.pow(ar(), 0.7) * 280), y = P.y - 80 + ar() * 330;
    const inAsh = (x - B[0]) * (A[1] - B[1]) - (y - B[1]) * (A[0] - B[0]) < 0;
    if (!inAsh) continue;
    const sz = ar.range(2, 9) * (0.6 + t * 0.6);
    const col = ar.pick(['#2B272E', '#3B363F', '#58535C', '#8C8790', '#1A171C']);
    flakes += `<path d="${GA.flake(x, y, sz, ar() * 6.28, ar)}" fill="${col}"/>`;
    if (ar() < 0.22) embers += `<path d="${GA.streak(x, y + ar.range(-20, 20), Math.atan2(P.y - y, P.x - x), ar.range(6, 18), ar.range(1.5, 3))}" fill="${ar() < 0.5 ? '#FF5A4E' : '#FFB08A'}"/>`;
  }
  s += `<g opacity=".95">${flakes}</g><g filter="url(#bloom)">${embers}</g>`;

  /* ---------- 5. the crimson ash slash (the split) ---------- */
  const sl = (w, extra = {}) => GA.sliver(B[0] - 20, B[1] + 30, A[0] + 16, A[1] - 30, w, Object.assign({ peak: 0.3, bow: 0 }, extra));
  s += `<path d="${sl(86)}" fill="#D62C34" filter="url(#blur14)" opacity=".85"/>
    <path d="${sl(56)}" fill="url(#slashFill)"/>
    <path d="${sl(38, { skew: 0.45 })}" fill="#120E12"/>
    <path d="${sl(6, { skew: 0.1 })}" fill="#FFE2DA" transform="translate(-9 -5)"/>`;

  /* ---------- 6. impact burst ---------- */
  s += `<circle cx="${P.x}" cy="${P.y}" r="150" fill="url(#flashRed)"/>
    <path d="${GA.rays(P.x, P.y, 22, 10, 140, 8, GA.rng(12), { even: true })}" fill="#FFF2C4" filter="url(#blur2)"/>
    <path d="${GA.rays(P.x, P.y, 12, 8, 100, 5, GA.rng(13), { even: true })}" fill="#FFFFFF"/>
    <circle cx="${P.x}" cy="${P.y}" r="78" fill="url(#flash)"/>`;
  // sparks
  let sp = '';
  const sr = GA.rng(31);
  for (let i = 0; i < 40; i++) {
    const a = sr() * 6.28, r = sr.range(40, 190);
    sp += `<path d="${GA.streak(P.x + Math.cos(a) * r, P.y + Math.sin(a) * r, a, sr.range(8, 26), sr.range(1.5, 3.5))}" fill="${sr() < 0.5 ? '#FFFFFF' : sr() < 0.5 ? '#FFD76A' : '#FF6A5A'}"/>`;
  }
  s += `<g filter="url(#bloom)">${sp}</g>`;

  /* ---------- 7. title ---------- */
  s += `<rect width="${W}" height="${H}" fill="url(#vig)"/>`;
  const ty = 454;
  if (LANG === 'ko') {
    const main = (attrs, inner) => `<text x="256" y="${ty}" text-anchor="middle" font-size="120" letter-spacing="-3" ${attrs}>${inner}</text>`;
    const words = (a, b) => `<tspan ${a}>금빛과</tspan><tspan dx="16" ${b}>재</tspan>`;
    s += main('fill="#000" stroke="#000" stroke-width="30" stroke-linejoin="round" filter="url(#textShadow)" opacity=".8" transform="translate(0 8)"', words('', ''));
    s += main('fill="#1A0B04" stroke="#1A0B04" stroke-width="24" stroke-linejoin="round" transform="translate(0 7)"', words('', ''));
    s += main('stroke-width="24" stroke-linejoin="round"', words('fill="#1A0B04" stroke="#1A0B04"', 'fill="#1A0B04" stroke="#1A0B04"'));
    s += main('stroke-width="11" stroke-linejoin="round"', words('fill="#9A4A0C" stroke="#9A4A0C"', 'fill="#A0161E" stroke="#A0161E"'));
    s += main('', words('fill="url(#txtGold)"', 'fill="url(#txtAsh)"'));
    s += `<text class="en" x="256" y="${ty + 42}" text-anchor="middle" font-size="30" letter-spacing="8" fill="#FFE8A0" stroke="#1A0B04" stroke-width="7" paint-order="stroke" stroke-linejoin="round">GOLD &amp; ASH</text>`;
  } else {
    const main = (attrs, inner) => `<text class="en" x="256" y="${ty}" text-anchor="middle" font-size="112" letter-spacing="1" ${attrs}>${inner}</text>`;
    const words = (a, b, c) => `<tspan ${a}>GOLD</tspan><tspan dx="10" ${c}>&amp;</tspan><tspan dx="10" ${b}>ASH</tspan>`;
    s += main('fill="#000" stroke="#000" stroke-width="30" stroke-linejoin="round" filter="url(#textShadow)" opacity=".8" transform="translate(0 8)"', words('', '', ''));
    s += main('fill="#1A0B04" stroke="#1A0B04" stroke-width="24" stroke-linejoin="round" transform="translate(0 7)"', words('', '', ''));
    s += main('stroke-width="24" stroke-linejoin="round" fill="#1A0B04" stroke="#1A0B04"', words('', '', ''));
    s += main('stroke-width="11" stroke-linejoin="round"', words('fill="#9A4A0C" stroke="#9A4A0C"', 'fill="#A0161E" stroke="#A0161E"', 'fill="#5a3a3a" stroke="#5a3a3a"'));
    s += main('', words('fill="url(#txtGold)"', 'fill="url(#txtAsh)"', 'fill="#FF5A4E"'));
    s += `<text x="256" y="${ty + 42}" text-anchor="middle" font-size="30" letter-spacing="10" fill="#FFE8A0" stroke="#1A0B04" stroke-width="7" paint-order="stroke" stroke-linejoin="round">금빛과 재</text>`;
  }

  document.getElementById('art').innerHTML = s;
}
GA.boot(draw);
</script>
</body>
</html>
