name: Build Jujutsu Kaisen Mod

on:
  workflow_dispatch:
  push:
    paths:
      - 'jujutsu-kaisen-mod/**'
      - '.github/workflows/build-jjk-mod.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jujutsu-kaisen-mod
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod jar
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Server smoke test (registries, data, entities)
        if: hashFiles('jujutsu-kaisen-mod/ci/smoketest.enabled') != ''
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\n" > run/server.properties
          timeout 900 ./gradlew runServer --no-daemon -Djjk.smoketest=true 2>&1 | tee smoketest.log
          grep -q "JJK-SMOKETEST: PASS" smoketest.log

      - name: API signature probe (javap)
        if: always() && hashFiles('jujutsu-kaisen-mod/ci/javap-classes.txt') != ''
        continue-on-error: true
        run: |
          JAR=$(find ~/.gradle/caches/forge_gradle -name 'forge-*_mapped_*.jar' ! -name '*sources*' | head -1)
          echo "Mapped jar: $JAR"
          while read -r cls; do
            [ -z "$cls" ] && continue
            echo "===== $cls"
            javap -cp "$JAR" -p "$cls" 2>&1 | head -400
          done < ci/javap-classes.txt

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: jujutsukaisen-mod-1.20.1
          path: jujutsu-kaisen-mod/build/libs/*.jar
          if-no-files-found: error
