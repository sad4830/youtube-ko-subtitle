name: Build Jujutsu Kaisen Mod

on:
  workflow_dispatch:
  push:
    paths:
      - 'jujutsu-kaisen-mod/**'
      - '.github/workflows/build-jjk-mod.yml'

# A newer push supersedes a running build (both would push screenshots and the jar to the branch).
concurrency:
  group: build-jjk-mod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: jujutsu-kaisen-mod
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod jar
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Server smoke test (registries, data, entities)
        if: hashFiles('jujutsu-kaisen-mod/ci/smoketest.enabled') != ''
        env:
          JJK_SMOKETEST: '1'
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\n" > run/server.properties
          timeout 900 ./gradlew runServer --no-daemon 2>&1 | tee smoketest.log || true
          echo "----- smoke test summary -----"
          grep -E "JJK-SMOKETEST|Exception|ERROR|Caused by" smoketest.log | head -150 || true
          grep -q "JJK-SMOKETEST: PASS" smoketest.log

      - name: Client screenshots (xvfb + Mesa)
        if: hashFiles('jujutsu-kaisen-mod/ci/screenshots.enabled') != ''
        env:
          JJK_CLIENTSHOT: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          mkdir -p run/saves && rm -rf run/saves/world && cp -r run/world run/saves/world
          printf "guiScale:2\nrenderDistance:8\nmaxFps:30\nonboardAccessibility:false\ntutorialStep:none\nskipMultiplayerWarning:true\njoinedFirstServer:true\nsoundCategory_master:0.0\nlang:ko_kr\n" > run/options.txt
          timeout 1200 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --no-daemon 2>&1 | tee client.log || true
          echo "----- client summary -----"
          grep -E "JJK-CLIENTSHOT|Exception|ERROR|OpenGL|GL version" client.log | head -120 || true
          ls -la run/screenshots || true

      - name: Publish screenshots to the branch
        if: hashFiles('jujutsu-kaisen-mod/ci/screenshots.enabled') != ''
        run: |
          ls run/screenshots/jjk_*.png >/dev/null 2>&1 || { echo "no screenshots"; exit 0; }
          python3 -m pip install -q pillow
          OUT="$RUNNER_TEMP/jjk-screenshots"
          rm -rf "$OUT" && mkdir -p "$OUT"
          OUT="$OUT" python3 - <<'PY'
          import glob, os
          from PIL import Image
          for p in sorted(glob.glob('run/screenshots/jjk_*.png')):
              im = Image.open(p).convert('RGB')
              im.thumbnail((960, 540))
              im.save(os.path.join(os.environ['OUT'], os.path.basename(p)[4:].replace('.png', '.jpg')), quality=82)
          PY
          cd ..
          # Publish onto the branch tip (never rebase binaries); a newer push cancels this run (concurrency).
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin ${GITHUB_REF_NAME}
          git checkout -q -B publish FETCH_HEAD
          rm -f jujutsu-kaisen-mod/docs/screenshots/*.jpg
          mkdir -p jujutsu-kaisen-mod/docs/screenshots && cp "$OUT"/*.jpg jujutsu-kaisen-mod/docs/screenshots/
          git add -A jujutsu-kaisen-mod/docs/screenshots
          git commit -q -m "Update in-game screenshots [skip ci]" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Check player technique test
        if: hashFiles('jujutsu-kaisen-mod/ci/screenshots.enabled') != ''
        run: |
          grep -E "JJK-PLAYERTEST" client.log || true
          grep -q "JJK-PLAYERTEST: PASS" client.log

      - name: Publish the verified jar to the branch
        if: hashFiles('jujutsu-kaisen-mod/ci/screenshots.enabled') != ''
        run: |
          OUT="$RUNNER_TEMP/jjk-jar"
          rm -rf "$OUT" && mkdir -p "$OUT"
          cp build/libs/jujutsukaisen-1.20.1-*.jar "$OUT"/
          ls -la "$OUT"
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin ${GITHUB_REF_NAME}
          git checkout -q -B publish FETCH_HEAD
          mkdir -p jujutsu-kaisen-mod/dist && rm -f jujutsu-kaisen-mod/dist/*.jar
          cp "$OUT"/*.jar jujutsu-kaisen-mod/dist/
          git add -A jujutsu-kaisen-mod/dist
          git commit -q -m "Update verified mod jar [skip ci]" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: API signature probe (javap)
        if: always() && hashFiles('jujutsu-kaisen-mod/ci/javap-classes.txt') != ''
        continue-on-error: true
        run: |
          JAR=$(find ~/.gradle/caches/forge_gradle -name 'forge-*_mapped_*.jar' ! -name '*sources*' | head -1)
          echo "Mapped jar: $JAR"
          while read -r cls; do
            [ -z "$cls" ] && continue
            echo "===== $cls"
            javap -cp "$JAR" -p "$cls" 2>&1 | head -400
          done < ci/javap-classes.txt

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: jujutsukaisen-mod-1.20.1
          path: jujutsu-kaisen-mod/build/libs/*.jar
          if-no-files-found: error
